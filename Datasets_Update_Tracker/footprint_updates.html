<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sioux Falls Dataset Changes</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6677; --line: #e2e5ea;
          --accent: #2f6fdb; --add: #15803d; --add-bg: #dcf3e3; --del: #b91c1c; --del-bg: #fde2e2; --edit: #9a5b00; --edit-bg: #fdf0dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b2; --line: #2e343e;
            --accent: #6ea2f5; --add: #4ade80; --add-bg: #17301f; --del: #f87171; --del-bg: #3a1818; --edit: #f0a54a; --edit-bg: #3a2c17; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 0 0 22px; }
  h2 { font-size: 1.15rem; margin: 0 0 2px; }
  section.ds + section.ds { margin-top: 36px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .src { margin: 0 0 4px; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .tag { border-radius: 99px; padding: 2px 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag.add { background: var(--add-bg); color: var(--add); }
  .tag.del { background: var(--del-bg); color: var(--del); }
  .tag.edit { background: var(--edit-bg); color: var(--edit); }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; }
  td.nowrap { white-space: nowrap; }
  .before { color: var(--del); text-decoration: line-through; text-decoration-thickness: 1px; }
  .after { color: var(--add); }
  .muted { color: var(--muted); }
  .big { font-size: 1.15rem; margin: 0; }
  .error { color: var(--del); }
  progress { width: 100%; height: 8px; }
</style>
</head>
<body>
<main>
  <h1>Sioux Falls datasets: changes</h1>
  <div id="sections"></div>
</main>

<script>
const SERVER = "https://gis.siouxfalls.gov/arcgis/rest/services/Data";
const DATASETS = [
  {
    key: "footprints", storeKey: "baseline", title: "Building Footprints",
    layer: `${SERVER}/Property/MapServer/5`,
    item: "https://www.arcgis.com/home/item.html?id=3ca4a96b2f5847fdbac6568c6dc20ee3&sublayer=5&dataTabView=table",
    labels: { "Shape.STArea()": "Footprint area (sq ft)", "Shape.STLength()": "Perimeter (ft)" },
    summary: ["STATUS", "STRUCTURE", "CAPTUREMETH", "COMMENTS"],   // shown for added/removed entries
    detectChanges: true,   // the City publishes no edit date for buildings, so record when this page first sees the data change
  },
  {
    key: "trees", storeKey: "baseline-trees", title: "Trees",
    layer: `${SERVER}/Trees/MapServer/10`,
    item: "https://www.arcgis.com/home/item.html?id=c880d62ae5fb4652b1f8e6cbca244107&dataTabView=table",
    labels: {},
    summary: ["SiteType", "FullName", "Status", "Address", "Location"],
    editDate: "last_edited_date",                          // the City records when each tree was edited
    ignore: ["last_edited_date", "last_edited_user"],     // change on every edit; shown as "Edited on" instead
  },
];
const DB = "sf-footprints", STORE = "snapshots";
const SHOW_MAX = 300;   // rows shown per dataset; the CSV has everything

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = v => new Date(v).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
const blank = v => v == null || String(v).trim() === "";

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + r.statusText);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || "server error");
  return j;
}
const q = (ds, params) => ds.layer + "/query?" + new URLSearchParams({ f: "json", ...params });
// Citation: the entry's record on the City's server (the server's HTML view is disabled, so this is readable JSON).
const recordUrl = (ds, id) => q(ds, { where: `OBJECTID=${id}`, outFields: "*", returnGeometry: false, f: "pjson" });
const cite = (ds, id) => `<a href="${esc(recordUrl(ds, id))}" target="_blank" rel="noopener" title="View this record on the City of Sioux Falls server">${esc(id)}</a>`;

// ---------- snapshot of every entry's attributes ----------
async function fetchSnapshot(ds, onProgress) {
  const ids = (await getJSON(q(ds, { where: "1=1", returnIdsOnly: true }))).objectIds.sort((a, b) => a - b);
  const chunks = [];
  for (let i = 0; i < ids.length; i += 1000) chunks.push([ids[i], ids[Math.min(i + 999, ids.length - 1)]]);
  const total = chunks.length, rows = {};
  let fields = null, done = 0;
  const worker = async () => {
    while (chunks.length) {
      const [a, b] = chunks.shift();
      const j = await getJSON(q(ds, { where: `OBJECTID BETWEEN ${a} AND ${b}`, outFields: "*", returnGeometry: false }));
      if (j.exceededTransferLimit) throw new Error("server returned a partial page; try again");
      for (const f of j.features) {
        fields ??= Object.keys(f.attributes);
        rows[f.attributes.OBJECTID] = fields.map(k => f.attributes[k]);
      }
      onProgress(++done / total);
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  return { time: new Date().toISOString(), fields, rows };
}

// ---------- compare two snapshots ----------
const same = (a, b) => a === b || (blank(a) && blank(b)) ||
  (typeof a === "number" && typeof b === "number" && Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(a)));

function compare(ds, base, cur) {
  const skip = new Set(["OBJECTID", ...(ds.ignore || [])]);
  const bi = Object.fromEntries(base.fields.map((f, i) => [f, i]));
  const edited = [], added = [], removed = [];
  for (const id in cur.rows) {
    const b = base.rows[id], c = cur.rows[id];
    if (!b) { added.push(id); continue; }
    const changes = [];
    cur.fields.forEach((f, i) => { if (!skip.has(f) && f in bi && !same(b[bi[f]], c[i])) changes.push({ field: f, before: b[bi[f]], after: c[i] }); });
    if (changes.length) edited.push({ id, changes });
  }
  for (const id in base.rows) if (!(id in cur.rows)) removed.push(id);
  return { edited, added, removed };
}

// ---------- labels and value formatting ----------
const labelOf = (ds, f) => ds.labels[f] || ds.fieldInfo[f]?.alias || f;
function show(ds, f, v) {
  if (blank(v)) return "(blank)";
  const info = ds.fieldInfo[f] || {};
  if (info.domain?.[v] != null) return info.domain[v];
  if (info.type === "esriFieldTypeDate") return new Date(v).toLocaleDateString([], { timeZone: "UTC", year: "numeric", month: "short", day: "numeric" });
  if (typeof v === "number" && !Number.isInteger(v)) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return typeof v === "number" ? v.toLocaleString() : String(v);
}
const valOf = (snap, id, f) => { const i = snap.fields.indexOf(f); return i < 0 ? undefined : snap.rows[id]?.[i]; };
const summaryOf = (ds, snap, id) => ds.summary.filter(f => !blank(valOf(snap, id, f)))
  .map(f => `${labelOf(ds, f)}: ${esc(show(ds, f, valOf(snap, id, f)))}`).join(" · ") || `<span class="muted">(no details)</span>`;

// ---------- saved baselines (this browser, IndexedDB) ----------
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadBaseline(key) {
  const db = await openDB();
  return new Promise((res, rej) => { const g = db.transaction(STORE).objectStore(STORE).get(key); g.onsuccess = () => res(g.result || null); g.onerror = () => rej(g.error); });
}
async function saveBaseline(key, snap) {
  const db = await openDB();
  return new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(snap, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}

// ---------- "last change detected" (for datasets without a City edit date) ----------
// A fingerprint of the data is stored on each visit; when it differs from the stored one, the time is recorded.
function fingerprint(ds, snap) {
  const keep = snap.fields.map((f, i) => (ds.ignore || []).includes(f) ? -1 : i).filter(i => i >= 0);
  const norm = v => blank(v) ? null : typeof v === "number" ? Number(v.toPrecision(9)) : v;
  const s = JSON.stringify([keep.map(i => snap.fields[i]), Object.entries(snap.rows).map(([id, r]) => [id, ...keep.map(i => norm(r[i]))])]);
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
async function trackChange(ds, cur) {
  const key = "lastchange-" + ds.key, fp = fingerprint(ds, cur);
  let rec = null;
  try { rec = await loadBaseline(key); } catch { return; }
  if (!rec || rec.fp !== fp) {
    // What changed: the pending changes first seen on this visit (from trackDetected, which runs first).
    const fresh = Object.keys(ds.detected || {}).filter(k => ds.detected[k] === cur.time);
    rec = rec ? { fp, time: cur.time, what: fresh[0] ?? null, more: Math.max(0, fresh.length - 1) }
              : { fp, time: null };   // first visit: nothing to compare against yet
    try { await saveBaseline(key, rec); } catch {}
  }
  ds.lastDetected = rec;
}
function describeChange(ds, rec) {
  if (!rec?.what) return "";
  const [kind, id, field] = JSON.parse(rec.what);
  const ref = kind === "Removed" ? esc(id) : cite(ds, id);   // a removed entry no longer has a record to cite
  const what = kind === "Edited" ? `OBJECTID ${ref}, ${esc(labelOf(ds, field))}` : `OBJECTID ${ref} ${kind.toLowerCase()}`;
  return ` · ${what}${rec.more ? ` (and ${rec.more.toLocaleString()} more)` : ""}`;
}
// Each pending change (entry + variable + new value) gets the time this page first saw it.
const changeKey = (kind, id, field = "", after = "") => JSON.stringify([kind, id, field, after]);
async function trackDetected(ds, base, cur) {
  const key = "detected-" + ds.key, d = compare(ds, base, cur);
  let old = null;
  try { old = await loadBaseline(key); } catch { return; }
  const keys = [
    ...d.added.map(id => changeKey("Added", id)),
    ...d.removed.map(id => changeKey("Removed", id)),
    ...d.edited.flatMap(e => e.changes.map(c => changeKey("Edited", e.id, c.field, c.after))),
  ];
  // Changes already pending when tracking started have no known time (null).
  ds.detected = Object.fromEntries(keys.map(k => [k, old ? (k in old ? old[k] : cur.time) : null]));
  try { await saveBaseline(key, ds.detected); } catch {}
}
const dateCol = ds => ds.editDate ? "Edited on" : ds.detectChanges ? "Detected on" : null;

const editNote = ds => ds.lastEdit ? ` · City's last edit: ${esc(when(ds.lastEdit))}${ds.lastEditId != null ? ` · OBJECTID ${cite(ds, ds.lastEditId)}` : ""}`
  : ds.detectChanges ? ` · Last change detected: ${ds.lastDetected?.time ? esc(when(ds.lastDetected.time)) + describeChange(ds, ds.lastDetected) : "none yet"}
      <span class="muted">(the City doesn't publish an edit date for buildings)</span>` : "";

// ---------- render ----------
function changeRows(ds, diff, base, cur) {
  const editedOn = id => ds.editDate ? valOf(cur, id, ds.editDate) : null;
  const seenOn = k => ds.detected?.[k] ? new Date(ds.detected[k]).getTime() : null;
  const on = (k, id) => ds.detectChanges ? seenOn(k) : editedOn(id);
  const rows = [];
  for (const id of diff.added) rows.push({ id, kind: "Added", field: "", before: "", after: summaryOf(ds, cur, id), html: true, on: on(changeKey("Added", id), id) });
  for (const id of diff.removed) rows.push({ id, kind: "Removed", field: "", before: summaryOf(ds, base, id), after: "", html: true, on: ds.detectChanges ? seenOn(changeKey("Removed", id)) : null });
  for (const e of diff.edited) for (const c of e.changes)
    rows.push({ id: e.id, kind: "Edited", field: labelOf(ds, c.field), before: show(ds, c.field, c.before), after: show(ds, c.field, c.after), on: on(changeKey("Edited", e.id, c.field, c.after), e.id) });
  return rows.sort((a, b) => (b.on ?? 0) - (a.on ?? 0) || b.id - a.id);
}

function downloadCSV(ds, rows, since) {
  const strip = s => String(s ?? "").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
  const cell = s => `"${strip(s).replace(/"/g, '""')}"`;
  const head = ["OBJECTID", "Change", "Variable", "Before", "After", ...(dateCol(ds) ? [dateCol(ds)] : []), "Source"];
  const csv = [head.join(","), ...rows.map(r => [r.id, r.kind, r.field, r.before, r.after, ...(dateCol(ds) ? [r.on ? when(r.on) : ""] : []),
    r.kind === "Removed" ? "" : recordUrl(ds, r.id)].map(cell).join(","))].join("\r\n");
  const a = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })),
    download: `${ds.key}_changes_since_${since.slice(0, 10)}.csv`,
  });
  a.click();
  URL.revokeObjectURL(a.href);
}

function render(ds, base, cur) {
  const diff = compare(ds, base, cur);
  const rows = changeRows(ds, diff, base, cur);
  ds.el.sub.innerHTML = `Changes since you last marked them as seen on ${esc(when(base.time))}${editNote(ds)}`;

  if (!rows.length) {
    ds.el.out.innerHTML = `<p class="big">No changes since ${esc(when(base.time))}.</p>
      <p class="muted" style="margin:6px 0 0">All ${Object.keys(cur.rows).length.toLocaleString()} entries match what you last saw.</p>`;
    return;
  }

  const kindTag = k => `<span class="tag ${k === "Added" ? "add" : k === "Removed" ? "del" : "edit"}">${k}</span>`;
  const shown = rows.slice(0, SHOW_MAX);
  ds.el.out.innerHTML = `
    <div class="summary">
      ${diff.edited.length ? `<span class="tag edit">${diff.edited.length.toLocaleString()} edited</span>` : ""}
      ${diff.added.length ? `<span class="tag add">${diff.added.length.toLocaleString()} added</span>` : ""}
      ${diff.removed.length ? `<span class="tag del">${diff.removed.length.toLocaleString()} removed</span>` : ""}
      <span class="spacer"></span>
      <button data-act="csv">Download CSV</button>
      <button data-act="seen" class="primary">Mark as seen</button>
    </div>
    <div class="scroll"><table>
      <tr><th>OBJECTID</th><th>Change</th><th>Variable</th><th>Before</th><th>After</th>${dateCol(ds) ? `<th>${dateCol(ds)}</th>` : ""}</tr>
      ${shown.map(r => `<tr><td class="nowrap">${r.kind === "Removed" ? esc(r.id) : cite(ds, r.id)}</td><td>${kindTag(r.kind)}</td><td>${esc(r.field)}</td>
        <td class="${r.html ? "muted" : "before"}">${r.html ? r.before : esc(r.before)}</td>
        <td class="${r.html ? "" : "after"}">${r.html ? r.after : esc(r.after)}</td>
        ${dateCol(ds) ? `<td class="nowrap muted">${r.on ? esc(when(r.on)) : "—"}</td>` : ""}</tr>`).join("")}
    </table></div>
    ${rows.length > SHOW_MAX ? `<p class="muted">Showing ${SHOW_MAX} of ${rows.length.toLocaleString()} changes. Download the CSV for all of them.</p>` : ""}`;

  ds.el.out.querySelector('[data-act="csv"]').onclick = () => downloadCSV(ds, rows, base.time);
  const seen = ds.el.out.querySelector('[data-act="seen"]');
  seen.onclick = async () => {
    seen.disabled = true;
    try { await saveBaseline(ds.storeKey, cur); render(ds, cur, cur); }
    catch (e) { seen.disabled = false; alert("Couldn't save: " + e.message); }
  };
}

function setupSection(ds) {
  const sec = document.createElement("section");
  sec.className = "ds";
  sec.innerHTML = `<h2>${esc(ds.title)}</h2>
    <p class="src"><a href="${esc(ds.item)}" target="_blank" rel="noopener">Data source: City of Sioux Falls, ${esc(ds.title)} ↗</a></p>
    <p class="sub">Loading…</p>
    <div class="card"><progress max="1" value="0"></progress></div>`;
  document.getElementById("sections").append(sec);
  ds.el = { sub: sec.querySelector(".sub"), out: sec.querySelector(".card"), prog: sec.querySelector("progress") };
}

async function runDataset(ds) {
  const prog = ds.el.prog;
  try {
    const info = await getJSON(ds.layer + "?f=json");
    ds.fieldInfo = Object.fromEntries(info.fields.map(f => [f.name, {
      alias: f.alias, type: f.type,
      domain: f.domain?.codedValues ? Object.fromEntries(f.domain.codedValues.map(c => [c.code, c.name])) : null,
    }]));
    if (ds.editDate) {
      const s = await getJSON(q(ds, { where: "1=1", outStatistics: JSON.stringify([{ statisticType: "max", onStatisticField: ds.editDate, outStatisticFieldName: "m" }]) }));
      ds.lastEdit = s.features[0]?.attributes.m ?? null;
    }
  } catch (e) {
    ds.el.sub.innerHTML = `<span class="error">Can't reach the City of Sioux Falls server: ${esc(e.message)}</span>`;
    ds.el.out.hidden = true;
    return;
  }

  let base = null;
  try { base = await loadBaseline(ds.storeKey); }
  catch { ds.el.sub.innerHTML = `<span class="error">This browser is blocking site storage, so the page can't remember what you've seen.</span>`; }

  let cur;
  try {
    ds.el.sub.textContent = `Downloading the current state of every entry…`;
    cur = await fetchSnapshot(ds, p => prog.value = p);
  } catch (e) {
    ds.el.sub.innerHTML = `<span class="error">Download from the City server failed: ${esc(e.message)}. Refresh to try again.</span>`;
    return;
  }
  if (ds.lastEdit != null) {   // which entry carries the City's latest edit date
    const i = cur.fields.indexOf(ds.editDate);
    ds.lastEditId = Object.keys(cur.rows).find(id => cur.rows[id][i] === ds.lastEdit) ?? null;
  }
  if (ds.detectChanges) {
    if (base) await trackDetected(ds, base, cur);
    await trackChange(ds, cur);
  }

  if (!base) {
    try { await saveBaseline(ds.storeKey, cur); } catch {}
    ds.el.sub.innerHTML = `First visit · ${esc(when(cur.time))}${editNote(ds)}`;
    ds.el.out.innerHTML = `<p class="big">Saved the current state of ${Object.keys(cur.rows).length.toLocaleString()} entries.</p>
      <p class="muted" style="margin:6px 0 0">Next time you open this page, anything the City has added, removed or edited since now will be listed here,
      with the variable that changed and its old and new values.</p>`;
    return;
  }
  render(ds, base, cur);
}

// Run one dataset at a time so the City's server isn't hit with too many requests at once.
DATASETS.forEach(setupSection);
(async () => { for (const ds of DATASETS) await runDataset(ds); })();
</script>
</body>
</html>

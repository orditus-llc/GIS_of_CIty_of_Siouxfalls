<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City of Sioux Falls</title>

  <!-- CesiumJS from a CDN, pinned to an exact version -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }

    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(38, 38, 38, 0.88); color: #fff;
      padding: 12px 14px; border-radius: 6px; width: 240px;
      font: 13px/1.5 sans-serif;
    }
    #panel h3 { margin: 0 0 8px; font-size: 15px; }
    #panel label { display: block; margin: 4px 0; }
    #panel select, #panel input[type=range] { width: 100%; }
    #panel fieldset { border: 1px solid #666; border-radius: 4px; margin: 8px 0; padding: 4px 8px; }
    #legend span { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; }
    #count { margin-top: 8px; color: #ccc; }

    #legend .hint { color: #aaa; font-size: 11px; margin: 8px 0 4px; }
    .legend-row {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: none; border: 0; border-radius: 3px; padding: 2px 4px;
      color: #fff; font: inherit;
    }
    .legend-row:hover { background: rgba(255, 255, 255, 0.12); }
    .legend-row.off { opacity: 0.4; text-decoration: line-through; }
    .legend-row em { color: #aaa; font-style: normal; }
    .legend-reset {
      margin-top: 4px; cursor: pointer; background: #555; color: #fff;
      border: 0; border-radius: 3px; padding: 2px 8px; font: inherit;
    }
  </style>
</head>
<body>
   <div id="cesiumContainer"></div>

  <div id="panel">
    <h3>Downtown Sioux Falls</h3>
    <label>Color by
      <select id="colorBy">
        <option value="stories">Number of stories</option>
        <option value="use">Use group</option>
        <option value="owner">Ownership</option>
        <option value="qa">Data quality</option>
      </select>
    </label>
    <fieldset>
      <legend>Show</legend>
      <label><input type="checkbox" id="showAccessory" checked> Accessory structures</label>
      <label><input type="checkbox" id="showProposed" checked> Proposed (no height)</label>
      <label><input type="checkbox" id="showSmall" checked> Footprints under 150 sq ft</label>
    </fieldset>
    <label>Minimum height: <span id="minHeightLabel">0</span> ft
      <input type="range" id="minHeight" min="0" max="170" step="5" value="0">
    </label>
    <label><input type="checkbox" id="shadows"> Sun shadows</label>
    <div id="legend"></div>
    <div id="count"></div>
  </div>
  <script>
    // Your Cesium ion token (ion.cesium.com -> Access Tokens).
    // Leave the placeholder here in the repo: the GitHub Actions deploy
    // replaces it with the CESIUM_ION_TOKEN repository secret.
    // Anyone can read it on a public page, so in the ion dashboard
    // restrict it to your GitHub Pages URL before publishing.
    // Without a token you get a flat globe.
    const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Im9ia2lNR3g1SjkxS0Y2SG8iLCJqdGkiOiJiNjg4ODQyNS1jZWYzLTQ3MjctODkwNi1mNGEwNzQ4NjY1NGIiLCJpZCI6NTQ2NTQ0LCJzdWIiOiJMb3phIEthc3NhIiwiaXNzIjoiaHR0cHM6Ly9hcGkuY2VzaXVtLmNvbSIsImF1ZCI6InNpb3V4LWZhbGxzLXRva2VuIiwiaWF0IjoxNzk0MzM5ODk2LCJleHAiOjE4MDk5NjY2NzF9.JXK9LePs8V_M3kFsa0inZ2TuD7HQ3y_Tk2h6zK4B4U8";
    const hasToken = !token.startsWith("PASTE");
    if (hasToken) Cesium.Ion.defaultAccessToken = token;

    // The 3D globe: OpenStreetMap streets, draped over Cesium's world terrain
    // when there's a token (a flat globe without one).
    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: hasToken ? Cesium.Terrain.fromWorldTerrain() : undefined,
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })
      ),
      baseLayerPicker: false,
    });

     // ===== DOWNTOWN BUILDINGS =====

    // Settings: the same City layers as get_buildings.py
    const BOUNDARY_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Community/MapServer/6";  // Downtown Business District
    const LAYER_URL    = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Property/MapServer/5";   // Building footprints
    const PAGE_SIZE = 1000;
    const FT_TO_M = 0.3048;  // City heights are in feet; Cesium uses meters

    // Ask a City layer a question (POST, because the boundary is too long for a URL)
    async function query(layerUrl, params) {
      const resp = await fetch(layerUrl + "/query", { method: "POST", body: new URLSearchParams(params) });
      if (!resp.ok) throw new Error("Server responded " + resp.status);
      return resp.json();
    }

    // Get the one Downtown Business District shape, in lat/lon
    async function getBoundary() {
      const result = await query(BOUNDARY_URL, { where: "1=1", outFields: "OBJECTID", outSR: 4326, f: "json" });
      if (result.error) throw new Error("Boundary: " + result.error.message);
      const n = result.features ? result.features.length : 0;
      if (n !== 1) throw new Error(`Expected 1 boundary shape, got ${n}`);
      return result.features[0].geometry;
    }

    async function loadBuildings() {
      // --- DOWNLOAD: buildings touching the downtown boundary, in lat/lon ---
      const boundary = await getBoundary();
      let features = [];
      while (true) {
        const page = await query(LAYER_URL, {
          where: "1=1", outFields: "*", orderByFields: "OBJECTID",
          resultOffset: features.length, resultRecordCount: PAGE_SIZE,
          outSR: 4326, f: "geojson",
          geometry: JSON.stringify(boundary), geometryType: "esriGeometryPolygon",
          inSR: 4326, spatialRel: "esriSpatialRelIntersects"
        });
        if (page.error) throw new Error("Buildings: " + page.error.message);
        const batch = page.features || [];
        features.push(...batch);
        if (batch.length < PAGE_SIZE) break;
      }

      // --- CLEAN: the QGIS Field Calculator steps (add new cleaning steps in this loop) ---
      for (const f of features) {
        const p = f.properties;

        // OCCUPIEDDATE: milliseconds -> YYYY-MM-DD
        if (typeof p.OCCUPIEDDATE === "number") {
          p.OCCUPIEDDATE = new Date(p.OCCUPIEDDATE).toISOString().slice(0, 10);
        }

        // bldg_height = BUILDINGTOPELEVATION - GROUNDELEVATION, with the 233281 correction
        if (p.OBJECTID === 233281) {
          p.bldg_height = 42;  // City value 4.1 ft is wrong: 3-story townhomes (City photo 2019)
        } else if (p.BUILDINGTOPELEVATION != null && p.GROUNDELEVATION != null) {
          p.bldg_height = p.BUILDINGTOPELEVATION - p.GROUNDELEVATION;
        } else {
          p.bldg_height = null;
        }

        // height_flag CASE expression
        if (p.STATUS === "Proposed" && p.BUILDINGTOPELEVATION == null) p.height_flag = "proposed_no_height";
        else if (p.bldg_height == null) p.height_flag = "missing";
        else p.height_flag = "measured";

        // Fields used by the panel's color modes and filters
        const code = p.STRUCTURE;
        p.use_group = code != null ? (USE_GROUP[Math.floor(code / 100)] || "other") : "other";
        p.is_accessory = code != null && code % 100 === 90;   // 190, 290, ... 790 = accessory structures
        p.area_sqft = p["Shape.STArea()"] ?? null;            // City area is in square feet
      }

      // --- REMOVE BUILDINGS: put any features.filter(...) lines here ---

      // Check against the QGIS results (expect 383 buildings: 379 measured, 4 proposed_no_height)
      const counts = {};
      for (const f of features) counts[f.properties.height_flag] = (counts[f.properties.height_flag] || 0) + 1;
      console.log(features.length, "buildings", counts, "loaded", new Date().toISOString().slice(0, 10));

      // --- DISPLAY: the QGIS 3D View steps, standing on the terrain ---
      const ds = await Cesium.GeoJsonDataSource.load(
        { type: "FeatureCollection", features },
        { clampToGround: true }
      );

      // Look up each entity's cleaned attributes by OBJECTID
      const propsById = new Map(features.map(f => [f.properties.OBJECTID, f.properties]));

      for (const e of ds.entities.values) {
        if (!e.polygon) continue;
        const p = propsById.get(e.properties.OBJECTID.getValue());
        const heightFt = p.bldg_height;

        e.polygon.outline = false;                                         // outlines aren't supported on terrain
        e.polygon.heightReference = Cesium.HeightReference.CLAMP_TO_GROUND; // base sits on the terrain
        e.polygon.shadows = Cesium.ShadowMode.ENABLED;
        if (heightFt != null) {
          e.polygon.extrudedHeight = heightFt * FT_TO_M;                   // QGIS "Extrusion", in meters
          e.polygon.extrudedHeightReference = Cesium.HeightReference.RELATIVE_TO_GROUND;
        }
        if (QA_NOTES[p.OBJECTID]) {
          e.description = `<p><b>QA note:</b> ${QA_NOTES[p.OBJECTID]}</p>` + e.description.getValue();
        }
        buildings.push({ entity: e, props: p });
      }
      viewer.dataSources.add(ds);
      applyStyle();

      // Tilted camera, like QGIS "New 3D Map View"
      viewer.zoomTo(ds, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), 1500));
    }

    // ===== COLOR MODES, LEGEND AND FILTERS =====

    // OWNEDBY codes -> readable labels (from the layer's field definitions)
    const OWNER = { "-1": "Private", "1": "City", "2": "City facility", "-2": "Other", "-3": "Renner Sanitary District" };

    // QA notes from the deep dive, keyed by OBJECTID
    const QA_NOTES = {
      185320: "1 story but 0.1 ft tall: green-space accessory (790), possibly a bad elevation value",
      205530: "Small shed/accessory, 4-5.5 ft (plausible)",
      229319: "Small shed/accessory, 4-5.5 ft (plausible)",
      230736: "Small shed/accessory, 4-5.5 ft (plausible)",
      233281: "Height corrected to 42 ft (City value 4.1 ft; 3-story townhomes, City photo 2019)",
      250262: "2 stories but 56.8 ft (28 ft per story): check on aerial imagery",
      207414: "4 Multi-Family addresses but UNITS = 0, likely missing",
    };

    // STRUCTURE code hundreds digit -> use group
    const USE_GROUP = { 1: "res", 2: "res", 3: "office", 4: "inst", 5: "comm", 6: "ind", 7: "green", 9: "other" };

    // Each mode: legend classes (in display order) and how to pick a class for a building
    const MODES = {
      stories: {
        classes: [
          { key: "1-2",   label: "1–2 stories",  color: "#c6dbef" },
          { key: "3-5",   label: "3–5 stories",  color: "#6baed6" },
          { key: "6-8",   label: "6–8 stories",  color: "#2171b5" },
          { key: "9-11",  label: "9–11 stories", color: "#08306b" },
          { key: "other", label: "Unknown",      color: "#d3d3d3" },
        ],
        classify: p => {
          const s = p.NUMBERSTORIES;
          if (s >= 1 && s <= 2) return "1-2";
          if (s >= 3 && s <= 5) return "3-5";
          if (s >= 6 && s <= 8) return "6-8";
          if (s >= 9 && s <= 11) return "9-11";
          return "other";
        },
      },
      use: {
        classes: [
          { key: "res",    label: "Residential",           color: "#f1c40f" },
          { key: "office", label: "Office & government",   color: "#3498db" },
          { key: "inst",   label: "Institutional & public", color: "#9b59b6" },
          { key: "comm",   label: "Commercial & mixed use", color: "#e74c3c" },
          { key: "ind",    label: "Industrial",            color: "#7f8c8d" },
          { key: "green",  label: "Green space",           color: "#27ae60" },
          { key: "other",  label: "Other / unknown",       color: "#d3d3d3" },
        ],
        classify: p => p.use_group,
      },
      owner: {
        classes: [
          { key: "-1",    label: "Private",       color: "#95a5a6" },
          { key: "1",     label: "City",          color: "#2980b9" },
          { key: "2",     label: "City facility", color: "#1abc9c" },
          { key: "-2",    label: "Other",         color: "#e67e22" },
          { key: "-3",    label: "Renner Sanitary District", color: "#8e44ad" },
          { key: "other", label: "Unknown",       color: "#d3d3d3" },
        ],
        classify: p => (OWNER[String(p.OWNEDBY)] ? String(p.OWNEDBY) : "other"),
      },
      qa: {
        classes: [
          { key: "measured",           label: "Measured height",      color: "#2ecc71" },
          { key: "note",               label: "QA note (click building)", color: "#e74c3c" },
          { key: "proposed_no_height", label: "Proposed, no height",  color: "#f39c12" },
          { key: "missing",            label: "Missing height",       color: "#8e44ad" },
        ],
        classify: p => (QA_NOTES[p.OBJECTID] ? "note" : p.height_flag),
      },
    };
    for (const mode of Object.values(MODES)) {
      for (const c of mode.classes) c.cesiumColor = Cesium.Color.fromCssColorString(c.color);
    }

    const buildings = [];  // { entity, props } for every footprint
    const hidden = {};     // per mode: Set of legend keys the user switched off
    for (const name in MODES) hidden[name] = new Set();

    const el = id => document.getElementById(id);

    // Recolor, filter and redraw the legend from the current panel settings
    function applyStyle() {
      const modeName = el("colorBy").value;
      const mode = MODES[modeName];
      const off = hidden[modeName];
      const minHeight = Number(el("minHeight").value);
      const showAccessory = el("showAccessory").checked;
      const showProposed = el("showProposed").checked;
      const showSmall = el("showSmall").checked;
      el("minHeightLabel").textContent = minHeight;

      const counts = {};
      let shown = 0;
      for (const { entity, props: p } of buildings) {
        let key = mode.classify(p);
        if (!mode.classes.some(c => c.key === key)) key = "other";
        const cls = mode.classes.find(c => c.key === key);
        entity.polygon.material = cls.cesiumColor;

        const passesFilters =
          (showAccessory || !p.is_accessory) &&
          (showProposed || p.height_flag !== "proposed_no_height") &&
          (showSmall || p.area_sqft == null || p.area_sqft >= 150) &&
          (minHeight === 0 || (p.bldg_height != null && p.bldg_height >= minHeight));

        if (passesFilters) counts[key] = (counts[key] || 0) + 1;  // legend counts ignore legend toggles
        entity.show = passesFilters && !off.has(key);
        if (entity.show) shown++;
      }

      renderLegend(mode, off, counts);
      el("count").textContent = `${shown} of ${buildings.length} buildings shown`;
    }

    function renderLegend(mode, off, counts) {
      const legend = el("legend");
      legend.innerHTML = '<div class="hint">Click a class to show/hide it</div>';
      for (const c of mode.classes) {
        if (!counts[c.key] && !off.has(c.key)) continue;  // skip empty classes
        const row = document.createElement("button");
        row.type = "button";
        row.className = "legend-row" + (off.has(c.key) ? " off" : "");
        row.innerHTML = `<span style="background:${c.color}"></span>${c.label} <em>(${counts[c.key] || 0})</em>`;
        row.addEventListener("click", () => {
          off.has(c.key) ? off.delete(c.key) : off.add(c.key);
          applyStyle();
        });
        legend.appendChild(row);
      }
      if (off.size) {
        const reset = document.createElement("button");
        reset.type = "button";
        reset.className = "legend-reset";
        reset.textContent = "Show all";
        reset.addEventListener("click", () => { off.clear(); applyStyle(); });
        legend.appendChild(reset);
      }
    }

    // Wire up the panel controls
    for (const id of ["colorBy", "showAccessory", "showProposed", "showSmall"]) {
      el(id).addEventListener("change", applyStyle);
    }
    el("minHeight").addEventListener("input", applyStyle);
    el("shadows").addEventListener("change", e => {
      viewer.shadows = e.target.checked;
      viewer.terrainShadows = e.target.checked ? Cesium.ShadowMode.RECEIVE_ONLY : Cesium.ShadowMode.DISABLED;
    });

    el("count").textContent = "Loading buildings…";
    loadBuildings().catch(err => {
      console.error(err);
      el("count").textContent = "Could not load buildings: " + err.message;
    });
  </script>
</body>
</html>

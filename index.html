<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cesium Hello World</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })
      ),
      baseLayerPicker: false,
      geocoder: false
    });

    viewer.dataSources.add(Cesium.GeoJsonDataSource.load("Bus_Routes.geojson", {
  stroke: Cesium.Color.CRIMSON,
  strokeWidth: 4
})).then(ds => viewer.zoomTo(ds));
  </script>
</body>
</html>

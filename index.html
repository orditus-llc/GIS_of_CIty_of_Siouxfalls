<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City of Sioux Falls</title>

  <!-- CesiumJS from a CDN, pinned to an exact version -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }

    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(38, 38, 38, 0.88); color: #fff;
      padding: 12px 14px; border-radius: 6px; width: 240px;
      font: 13px/1.5 sans-serif;
    }
    #panel h3 { margin: 0 0 8px; font-size: 15px; }
    #panel label { display: block; margin: 4px 0; }
    #panel select, #panel input[type=range] { width: 100%; }
    #panel fieldset { border: 1px solid #666; border-radius: 4px; margin: 8px 0; padding: 4px 8px; }
    #legend span { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; box-sizing: border-box; border: 1px solid #888; }
    #count { margin-top: 8px; color: #ccc; }

    #showFilters .hint { color: #aaa; font-size: 11px; margin: 2px 0 4px; }
    #legend .hint { color: #aaa; font-size: 11px; margin: 8px 0 4px; }
    .legend-row {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: none; border: 0; border-radius: 3px; padding: 2px 4px;
      color: #fff; font: inherit;
    }
    .legend-row:hover { background: rgba(255, 255, 255, 0.12); }
    .legend-row.off { opacity: 0.4; text-decoration: line-through; }
    .legend-row.selected { background: rgba(255, 255, 255, 0.2); font-weight: bold; }
    .legend-row.dim { opacity: 0.5; }
    .legend-row em { color: #aaa; font-style: normal; }
    .legend-reset {
      margin-top: 4px; cursor: pointer; background: #555; color: #fff;
      border: 0; border-radius: 3px; padding: 2px 8px; font: inherit;
    }
  </style>
</head>
<body>
   <div id="cesiumContainer"></div>

  <div id="panel">
    <h3>Downtown Sioux Falls</h3>
    <label>Color by
      <select id="colorBy">
        <option value="stories">Number of stories</option>
        <option value="use" selected>Use group</option>
        <option value="owner">Ownership</option>
        <option value="qa">Data quality</option>
      </select>
    </label>
    <fieldset>
      <legend>Show</legend>
      <div id="showFilters"></div>
    </fieldset>
    <label>Minimum height: <span id="minHeightLabel">0</span> ft
      <input type="range" id="minHeight" min="0" max="170" step="5" value="0">
    </label>
    <label><input type="checkbox" id="shadows"> Sun shadows</label>
    <div id="legend"></div>
    <div id="count"></div>
  </div>
  <script>
    // Your Cesium ion token (ion.cesium.com -> Access Tokens).
    // Leave the placeholder here in the repo: the GitHub Actions deploy
    // replaces it with the CESIUM_ION_TOKEN repository secret.
    // Anyone can read it on a public page, so in the ion dashboard
    // restrict it to your GitHub Pages URL before publishing.
    // Without a token you get a flat globe.
    //
    // Local testing (Live Server): run this once in the browser console,
    //   localStorage.setItem("cesiumToken", "<your token>")
    // and reload. It stays in your browser only, never in the repo.
    let token = "PASTE_YOUR_TOKEN_HERE";
    if (token.startsWith("PASTE")) {
      try { token = localStorage.getItem("cesiumToken") || token; } catch (e) { /* storage blocked */ }
    }
    const hasToken = !token.startsWith("PASTE");
    if (hasToken) Cesium.Ion.defaultAccessToken = token;

    // The 3D globe: OpenStreetMap streets, draped over Cesium's world terrain
    // when there's a token (a flat globe without one).
    const terrain = hasToken ? Cesium.Terrain.fromWorldTerrain() : undefined;
    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain,
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })
      ),
      baseLayerPicker: false,
    });

    // ===== STARTING VIEW =====
    // Where the camera starts: looking at downtown Sioux Falls, tilted like
    // QGIS "New 3D Map View". Raise START_DISTANCE_M to start further out,
    // lower it to start closer in.
    const START_CENTER = { lon: -96.7270, lat: 43.5470, height: 450 };  // downtown; ground is ~450 m above sea level
    const START_DISTANCE_M = 3500;   // camera distance from the center, in meters
    const START_PITCH_DEG  = -40;    // tilt: -90 = straight down, 0 = horizon
    function goToStart(duration) {
      viewer.camera.flyToBoundingSphere(
        new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(START_CENTER.lon, START_CENTER.lat, START_CENTER.height), 0),
        { offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(START_PITCH_DEG), START_DISTANCE_M), duration }
      );
    }
    goToStart(0);  // jump straight there when the page opens

    // The Home button (top right) flies back to this starting view instead of the whole globe
    viewer.homeButton.viewModel.command.beforeExecute.addEventListener(e => {
      e.cancel = true;   // skip Cesium's default "zoom out to the world"
      goToStart(1.5);    // smooth 1.5-second flight
    });

    // ===== LOOK: sun lighting, smooth edges =====
    // A fixed late-afternoon sun so each wall gets its own shade (use the
    // timeline at the bottom to move the sun; turn on "Sun shadows" to cast them).
    viewer.clock.currentTime = Cesium.JulianDate.fromIso8601("2026-09-15T21:00:00Z");  // 4 pm CDT
    viewer.clock.shouldAnimate = false;

    // Anti-aliasing: smooths jagged building edges
    viewer.scene.postProcessStages.fxaa.enabled = true;

    // Wait for the world terrain to be ready (null without a token or if it fails)
    function terrainProvider() {
      if (!terrain) return Promise.resolve(null);
      if (terrain.ready) return Promise.resolve(terrain.provider);
      return new Promise(resolve => {
        terrain.readyEvent.addEventListener(provider => resolve(provider));
        terrain.errorEvent.addEventListener(() => resolve(null));
      });
    }

     // ===== DOWNTOWN BUILDINGS =====

    // Settings: the same City layers as get_buildings.py
    const BOUNDARY_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Community/MapServer/6";  // Downtown Business District
    const LAYER_URL    = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Property/MapServer/5";   // Building footprints
    const PAGE_SIZE = 1000;
    const FT_TO_M = 0.3048;  // City heights are in feet; Cesium uses meters

    // Ask a City layer a question (POST, because the boundary is too long for a URL)
    async function query(layerUrl, params) {
      const resp = await fetch(layerUrl + "/query", { method: "POST", body: new URLSearchParams(params) });
      if (!resp.ok) throw new Error("Server responded " + resp.status);
      return resp.json();
    }

    // Get the one Downtown Business District shape, in lat/lon (downloaded once, shared by all layers)
    let boundaryPromise = null;
    function getBoundary() {
      boundaryPromise ??= (async () => {
        const result = await query(BOUNDARY_URL, { where: "1=1", outFields: "OBJECTID", outSR: 4326, f: "json" });
        if (result.error) throw new Error("Boundary: " + result.error.message);
        const n = result.features ? result.features.length : 0;
        if (n !== 1) throw new Error(`Expected 1 boundary shape, got ${n}`);
        return result.features[0].geometry;
      })();
      return boundaryPromise;
    }

    // Download every feature of a City layer that touches the downtown boundary, as GeoJSON.
    // Paging by offset is unreliable on this server (pages come back short and overlap,
    // e.g. 1,628 trees for 1,586 real ones), so first ask for the matching IDs, then
    // download the features by ID in chunks.
    async function queryDowntown(layerUrl, label, { where = "1=1", outFields = "*" } = {}) {
      const boundary = await getBoundary();
      const idResult = await query(layerUrl, {
        where, returnIdsOnly: true, f: "json",
        geometry: JSON.stringify(boundary), geometryType: "esriGeometryPolygon",
        inSR: 4326, spatialRel: "esriSpatialRelIntersects",
      });
      if (idResult.error) throw new Error(label + ": " + idResult.error.message);
      const ids = (idResult.objectIds || []).sort((a, b) => a - b);

      const features = [];
      for (let i = 0; i < ids.length; i += PAGE_SIZE / 2) {
        const page = await query(layerUrl, {
          objectIds: ids.slice(i, i + PAGE_SIZE / 2).join(","),
          outFields, outSR: 4326, f: "geojson",
        });
        if (page.error) throw new Error(label + ": " + page.error.message);
        features.push(...(page.features || []));
      }
      return features;
    }

    async function loadBuildings() {
      // --- DOWNLOAD: buildings touching the downtown boundary, in lat/lon ---
      const features = await queryDowntown(LAYER_URL, "Buildings");

      // --- CLEAN: the QGIS Field Calculator steps (add new cleaning steps in this loop) ---
      for (const f of features) {
        const p = f.properties;

        // OCCUPIEDDATE: milliseconds -> YYYY-MM-DD
        if (typeof p.OCCUPIEDDATE === "number") {
          p.OCCUPIEDDATE = new Date(p.OCCUPIEDDATE).toISOString().slice(0, 10);
        }

        // bldg_height = BUILDINGTOPELEVATION - GROUNDELEVATION, with the 233281 correction
        if (p.OBJECTID === 233281) {
          p.bldg_height = 42;  // City value 4.1 ft is wrong: 3-story townhomes (City photo 2019)
        } else if (p.BUILDINGTOPELEVATION != null && p.GROUNDELEVATION != null) {
          p.bldg_height = p.BUILDINGTOPELEVATION - p.GROUNDELEVATION;
        } else {
          p.bldg_height = null;
        }

        // height_flag CASE expression
        if (p.STATUS === "Proposed" && p.BUILDINGTOPELEVATION == null) p.height_flag = "proposed_no_height";
        else if (p.bldg_height == null) p.height_flag = "missing";
        else p.height_flag = "measured";

        // Fields used by the panel's color modes and filters
        const code = p.STRUCTURE;
        p.use_group = code != null ? (USE_GROUP[Math.floor(code / 100)] || "other") : "other";
        p.is_accessory = code != null && code % 100 === 90;   // 190, 290, ... 790 = accessory structures
        p.area_sqft = p["Shape.STArea()"] ?? null;            // City area is in square feet
      }

      // --- NAMES AND HISTORIC LANDMARKS: matched to footprints by location (before any split) ---
      await addNamesAndHistory(features);

      // --- SPLIT FOOTPRINTS: one City footprint drawn as a tall part + a low part ---
      for (const f of features) {
        const fix = SPLIT_FOOTPRINTS[f.properties.OBJECTID];
        if (!fix) continue;
        const area = f.properties.area_sqft;
        if (area == null || Math.abs(area - fix.expectAreaSqft) > 5) {
          console.warn(`Footprint ${f.properties.OBJECTID} changed at the City; split not applied`);
          continue;
        }
        f.geometry = { type: "Polygon", coordinates: [fix.tall.ring] };
        f.properties.extra_parts = fix.low;
      }

      // --- REMOVE BUILDINGS: put any features.filter(...) lines here ---

      // Check against the QGIS results (expect 383 buildings: 379 measured, 4 proposed_no_height)
      const counts = {};
      for (const f of features) counts[f.properties.height_flag] = (counts[f.properties.height_flag] || 0) + 1;
      console.log(features.length, "buildings", counts, "loaded", new Date().toISOString().slice(0, 10));

      // --- DISPLAY: the QGIS 3D View steps, standing on the terrain ---
      const ds = await Cesium.GeoJsonDataSource.load({ type: "FeatureCollection", features });

      // Look up each entity's cleaned attributes by OBJECTID
      const propsById = new Map(features.map(f => [f.properties.OBJECTID, f.properties]));

      // The City's names for the STRUCTURE codes (e.g. 530 -> "Mixed Use - Downtown/Village")
      const structureNames = await getStructureNames();

      // Ground height under every footprint corner, sampled once from the terrain.
      // Standing buildings at a known height (instead of clamping them to the
      // terrain) is what lets Cesium draw their edge outlines.
      const polys = ds.entities.values.filter(e => e.polygon);
      const corners = polys.map(e =>
        e.polygon.hierarchy.getValue(Cesium.JulianDate.now()).positions
          .map(c => Cesium.Cartographic.fromCartesian(c)));
      const provider = await terrainProvider();
      if (provider) {
        try { await Cesium.sampleTerrainMostDetailed(provider, corners.flat()); }
        catch (err) { console.warn("Terrain sampling failed, using height 0", err); }
      }

      polys.forEach((e, i) => {
        const p = propsById.get(e.properties.OBJECTID.getValue());
        const heightFt = p.bldg_height;
        e.polygon.shadows = Cesium.ShadowMode.ENABLED;

        if (heightFt != null) {
          const ground = corners[i].map(c => c.height || 0);
          const lowest = Math.min(...ground);
          const average = ground.reduce((a, b) => a + b, 0) / ground.length;
          e.polygon.height = lowest - 0.5;                           // base tucked just below the lowest corner
          e.polygon.extrudedHeight = average + heightFt * FT_TO_M;   // QGIS "Extrusion", in meters
          e.polygon.outline = true;                                  // dark edges instead of a flat-looking box
          e.polygon.outlineColor = Cesium.Color.BLACK.withAlpha(0.45);
          e.polygon.outlineWidth = 1;
        } else {
          // No height (proposed): a flat footprint draped on the terrain
          e.polygon.outline = false;
          e.polygon.heightReference = Cesium.HeightReference.CLAMP_TO_GROUND;
        }
        // Click popup: building name (or type) as the title, plain-language rows below
        const type = buildingType(p.STRUCTURE, structureNames);
        e.name = buildingTitle(p, type);
        e.description = popupHtml(p, type, e.name);

        // Historic landmark: an icon floating above the roof (click it for the same popup)
        const icons = [];
        if (p.historic.length) {
          const ground = corners[i].map(c => c.height || 0);
          const top = ground.reduce((a, b) => a + b, 0) / ground.length + (heightFt || 0) * FT_TO_M;
          const lon = corners[i].reduce((a, c) => a + c.longitude, 0) / corners[i].length;
          const lat = corners[i].reduce((a, c) => a + c.latitude, 0) / corners[i].length;
          icons.push(ds.entities.add({
            name: e.name, description: e.description,
            position: Cesium.Cartesian3.fromRadians(lon, lat, top + 4),
            billboard: {
              image: HISTORIC_ICON, width: 30, height: 30,
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              disableDepthTestDistance: Number.POSITIVE_INFINITY,   // never hidden inside the building
              scaleByDistance: new Cesium.NearFarScalar(500, 1.0, 8000, 0.5),
            },
          }));
        }

        // Extra low parts of a split footprint: same popup, colored and shown with the main part
        const parts = (p.extra_parts || []).map(part => {
          const ground = corners[i].map(c => c.height || 0);
          return ds.entities.add({
            name: e.name, description: e.description,
            polygon: {
              hierarchy: Cesium.Cartesian3.fromDegreesArray(part.ring.flat()),
              height: Math.min(...ground) - 0.5,
              extrudedHeight: ground.reduce((a, b) => a + b, 0) / ground.length + part.heightFt * FT_TO_M,
              outline: true, outlineColor: Cesium.Color.BLACK.withAlpha(0.45), outlineWidth: 1,
              shadows: Cesium.ShadowMode.ENABLED,
            },
          });
        });
        buildings.push({ entity: e, props: p, parts, icons });
      });
      viewer.dataSources.add(ds);
      applyStyle();
      // No camera move here: the camera already starts over downtown (see STARTING VIEW),
      // so it doesn't jump in on the user once the buildings finish loading.
    }

    // ===== TREES =====

    // City tree inventory. Only living trees: the layer also holds planting sites,
    // removal sites and stumps. Height and Spread are in feet, Diameter (trunk) in inches.
    const TREES_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Trees/MapServer/10";
    // Fields the data library marks "add as comments": shown behind the popup's "More info" button
    const TREE_COMMENTS = [
      ["SpecialComments", "Special comments"], ["Comments", "Comments"], ["Special", "Special tree"],
      ["Source", "Source"], ["Project", "Project"],
      ["TreatmentApplied", "Treatment applied"], ["TreatmentYear", "Treatment year"],
      ["RemovalYear", "Removal year"], ["RemovalLot", "Removal lot"], ["PaintedDate", "Marked (painted)"],
      ["Contractor", "Contractor"], ["ContractorCutNotes", "Contractor notes"],
      ["PhotoURL", "Photo"], ["Risk", "Risk"],   // Risk last: "comment at the bottom"
    ];
    const TREE_FIELDS = "OBJECTID,SiteType,FullName,TreeType,Height,Spread,Diameter,ConditionAssesment,LocationName,"
                      + TREE_COMMENTS.map(([f]) => f).join(",");
    const treeSource = new Cesium.CustomDataSource("Trees");
    viewer.dataSources.add(treeSource);

    const TRUNK_COLOR   = Cesium.Color.fromCssColorString("#6b4f35");
    const LEAF_COLORS   = ["#4e8a3a", "#5b9442", "#467f35", "#62994a"].map(c => Cesium.Color.fromCssColorString(c));
    const CONIFER_COLOR = Cesium.Color.fromCssColorString("#2f5d3a");

    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // Fill in missing sizes so every tree gets a believable shape (feet)
    function treeSize(p) {
      const conifer = p.TreeType === "Coniferous";
      let height = p.Height > 0 ? p.Height
                 : p.Diameter > 0 ? Math.min(Math.max(p.Diameter * 2.2, 8), 60)  // rough height from trunk size
                 : 25;                                                           // downtown median
      let spread = p.Spread > 0 ? p.Spread : height * (conifer ? 0.4 : 0.65);
      spread = Math.min(Math.max(spread, 3), height * 1.3);
      const trunkRadiusM = p.Diameter > 0 ? (p.Diameter * 0.0254) / 2 : height * FT_TO_M * 0.015;
      return { conifer, h: height * FT_TO_M, r: (spread / 2) * FT_TO_M, trunkR: Math.max(trunkRadiusM, 0.08) };
    }

    // "More info" button: the comment fields that have a value, in a collapsible section.
    // Uses <details> because the popup panel doesn't run scripts.
    function treeCommentsHtml(p) {
      const show = v => {
        if (typeof v === "number" && v > 1e11) return new Date(v).toISOString().slice(0, 10);  // date (ms)
        return v;
      };
      const rows = TREE_COMMENTS
        .filter(([f]) => p[f] != null && String(p[f]).trim() !== "")
        .map(([f, label]) => {
          const v = f === "PhotoURL"
            ? `<a href="${esc(p[f])}" target="_blank" rel="noopener">View photo</a>`
            : esc(show(p[f]));
          return `<tr><th>${label}</th><td>${v}</td></tr>`;
        });
      if (!rows.length) return "";
      return `<details style="margin-top:8px">` +
        `<summary style="cursor:pointer;display:inline-block;padding:4px 10px;border-radius:4px;` +
        `background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3)">ℹ More info</summary>` +
        `<table class="cesium-infoBox-defaultTable" style="margin-top:6px"><tbody>${rows.join("")}</tbody></table>` +
        `</details>`;
    }

    async function loadTrees() {
      const features = await queryDowntown(TREES_URL, "Trees", {
        where: "SiteType IN ('Tree','Memorial Tree','Treated')",
        outFields: TREE_FIELDS,
      });

      // Ground height under each tree (0 without terrain)
      const spots = features.map(f => Cesium.Cartographic.fromDegrees(...f.geometry.coordinates));
      const provider = await terrainProvider();
      if (provider) {
        try { await Cesium.sampleTerrainMostDetailed(provider, spots); }
        catch (err) { console.warn("Tree terrain sampling failed, using height 0", err); }
      }

      const lift = (spot, metersUp) =>
        Cesium.Cartesian3.fromRadians(spot.longitude, spot.latitude, (spot.height || 0) + metersUp);

      features.forEach((f, i) => {
        const p = f.properties;
        const { conifer, h, r, trunkR } = treeSize(p);
        const spot = spots[i];
        const name = p.FullName || "Tree";
        const description =
          `<table class="cesium-infoBox-defaultTable"><tbody>` +
          [["Species", p.FullName], ["Height", p.Height ? p.Height + " ft" : "not recorded"],
           ["Crown spread", p.Spread ? p.Spread + " ft" : "not recorded"],
           ["Trunk diameter", p.Diameter ? p.Diameter + " in" : "not recorded"],
           ["Condition", p.ConditionAssesment],
           ["Location", p.LocationName], ["Site type", p.SiteType]]
            .filter(([, v]) => v != null && v !== "")
            .map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join("") +
          `</tbody></table>` + treeCommentsHtml(p);

        // Trunk: a thin cylinder up into the crown
        const trunkH = h * (conifer ? 0.3 : 0.5);
        treeSource.entities.add({
          name, description,
          position: lift(spot, trunkH / 2),
          cylinder: {
            length: trunkH, topRadius: trunkR, bottomRadius: trunkR, slices: 8,
            material: TRUNK_COLOR, shadows: Cesium.ShadowMode.ENABLED,
          },
        });

        if (conifer) {
          // Evergreen: a cone from 15% of the height to the top
          const coneH = h * 0.85;
          treeSource.entities.add({
            name, description,
            position: lift(spot, h - coneH / 2),
            cylinder: {
              length: coneH, topRadius: 0, bottomRadius: r, slices: 12,
              material: CONIFER_COLOR, shadows: Cesium.ShadowMode.ENABLED,
            },
          });
        } else {
          // Broadleaf: a rounded crown over the top 60% of the height
          const crownHalf = h * 0.3;
          treeSource.entities.add({
            name, description,
            position: lift(spot, h - crownHalf),
            ellipsoid: {
              radii: new Cesium.Cartesian3(r, r, crownHalf),
              stackPartitions: 10, slicePartitions: 12,
              material: LEAF_COLORS[p.OBJECTID % LEAF_COLORS.length],
              shadows: Cesium.ShadowMode.ENABLED,
            },
          });
        }
      });

      console.log(features.length, "trees loaded");
    }

    // ===== COLOR MODES, LEGEND AND FILTERS =====

    // OWNEDBY codes -> readable labels (from the layer's field definitions)
    const OWNER = { "-1": "Private", "1": "City", "2": "City facility", "-2": "Other", "-3": "Renner Sanitary District" };

    // ===== CLICK POPUP =====

    // Download the City's list of STRUCTURE code names once (a plain "Building" title if it fails)
    async function getStructureNames() {
      try {
        const info = await (await fetch(LAYER_URL + "?f=json")).json();
        const field = info.fields.find(f => f.name === "STRUCTURE");
        return new Map(field.domain.codedValues.map(c => [c.code, c.name]));
      } catch (err) {
        console.warn("Could not load structure names", err);
        return new Map();
      }
    }

    // "530 Mixed Use - Downtown/Village" -> "Mixed Use – Downtown/Village"
    function buildingType(code, names) {
      const name = names.get(code);
      return name ? name.replace(/^\d+\s*/, "").replace(" - ", " – ") : "Building";
    }

    // Popup title: historic name, else the building's own name(s), else the building type
    function buildingTitle(p, type) {
      if (p.historic.length) return p.historic[0].DESCRIP;
      if (p.names.length === 1 || p.names.length === 2) return p.names.join(" / ");
      return type;   // no name, or 3+ names (listed in the popup instead)
    }

    // The rows a visitor sees when clicking a building. Empty values are skipped.
    function popupHtml(p, type, title) {
      const fmt = n => Math.round(n).toLocaleString("en-US");
      const useClass = MODES.use.classes.find(c => c.key === p.use_group);
      const otherNames = p.names.filter(n => !title.includes(n));
      // Office building without its own name: list the businesses registered at its address points
      const tenants = OFFICE_CODES.has(p.STRUCTURE) && !p.names.length && p.tenants.length
        ? p.tenants.slice(0, 15).join(", ") + (p.tenants.length > 15 ? `, and ${p.tenants.length - 15} more` : "")
        : null;
      const rows = [
        ["Building type",         title !== type ? type : null],
        [title === type ? "Names" : "Also known as", otherNames.length ? otherNames.join(", ") : null],
        ["Businesses inside",     tenants],
        ["Address",               p.addresses.length ? p.addresses.slice(0, 3).join("; ") : null],
        ["Use",                   useClass && useClass.label],
        ["Height",                p.bldg_height != null ? `${fmt(p.bldg_height)} ft` : null],
        ["Stories",               p.NUMBERSTORIES || null],
        ["Housing units",         p.UNITS > 0 ? fmt(p.UNITS) : null],
        ["Footprint",             p.area_sqft != null ? `${fmt(p.area_sqft)} sq ft` : null],
        ["Year occupied",         p.OCCUPIEDDATE ? String(p.OCCUPIEDDATE).slice(0, 4) : null],
        ["Owner",                 OWNER[String(p.OWNEDBY)]],
        ["Status",                p.STATUS === "Proposed" ? "Proposed: not constructed yet" : p.STATUS],
        ["Indoor parking spaces", p.InternalParkingSpaces > 0 ? fmt(p.InternalParkingSpaces) : null],
        ["Data note",             QA_NOTES[p.OBJECTID]],
      ].filter(([, v]) => v != null && v !== "");
      return `<table class="cesium-infoBox-defaultTable"><tbody>` +
        rows.map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join("") +
        `</tbody></table>` + historicHtml(p) +
        `<p style="font-size:11px;color:#aaa;margin:8px 4px">City building ID ${p.OBJECTID} · Source: City of Sioux Falls ` +
        `(Building Footprints, Address Points${p.historic.length ? ", Historic Properties" : ""})</p>`;
    }

    // "Quick facts" box for historic landmarks (City Historic Properties layer)
    function historicHtml(p) {
      const when = v => v == null || v === "" ? "" : typeof v === "number" ? ` (${new Date(v).toISOString().slice(0, 10)})` : ` (${v})`;
      return p.historic.map(h => {
        const rows = [
          ["Name",       h.DESCRIP],
          ["Year built", h.YEARBUILT],
          ["Address",    h.LOCATION],
          ["National Register of Historic Places", h.NATIONAL_REGISTER === "Yes" ? "Listed" + when(h.NATIONAL_REG_DATE) : null],
          ["Sioux Falls local historic register",  h.LOCAL_REGISTER === "Yes" ? "Listed" + when(h.LOCAL_REG_DATE) : null],
        ].filter(([, v]) => v != null && v !== "");
        return `<div style="margin:8px 0;padding:6px 8px;border-left:3px solid #d4a017;background:rgba(212,160,23,0.12)">` +
          `<b>🏛 Historic landmark: quick facts</b>` +
          `<table class="cesium-infoBox-defaultTable" style="margin-top:4px"><tbody>` +
          rows.map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join("") +
          `</tbody></table></div>`;
      }).join("");
    }

    // ===== BUILDING NAMES AND HISTORIC LANDMARKS =====

    const ADDRESS_URL  = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Property/MapServer/0";    // Address Points
    const HISTORIC_URL = "https://gis.siouxfalls.gov/arcgis/rest/services/Data/Community/MapServer/13";  // Historic Properties
    const OFFICE_CODES = new Set([310, 311, 330, 331]);   // STRUCTURE codes for office buildings

    const HISTORIC_ICON = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">` +
      `<circle cx="18" cy="18" r="16" fill="#8a5a00" stroke="#fff" stroke-width="2"/>` +
      `<path fill="#fff" d="M18 8 L28 13 H8 Z M10 14 h16 v2 H10 Z M11 17 h2.5 v7 H11 Z ` +
      `M16.75 17 h2.5 v7 h-2.5 Z M22.5 17 h2.5 v7 H22.5 Z M9 25 h18 v2.5 H9 Z"/></svg>`);

    // Is (x, y) inside a polygon given as GeoJSON rings? (even-odd rule, holes included)
    function inRings(x, y, rings) {
      let inside = false;
      for (const ring of rings) {
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [x1, y1] = ring[i], [x2, y2] = ring[j];
          if ((y1 > y) !== (y2 > y) && x < x1 + (y - y1) * (x2 - x1) / (y2 - y1)) inside = !inside;
        }
      }
      return inside;
    }
    const polygonsOf = g => !g ? [] : g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];

    // Give every building: names (building-level address names), tenants (unit/suite names),
    // addresses, and historic (Historic Properties records). Address points and footprints share
    // no ID, so a point belongs to the footprint it sits in. Historic properties are matched by
    // their address first; if that fails, to the footprint most inside the historic parcel.
    async function addNamesAndHistory(features) {
      for (const f of features) Object.assign(f.properties, { names: [], tenants: [], addresses: [], historic: [] });
      let points, historic;
      try {
        [points, historic] = await Promise.all([
          queryDowntown(ADDRESS_URL, "Addresses", { outFields: "ADDRESS,ALIAS,POINTTYPE" }),
          queryDowntown(HISTORIC_URL, "Historic", { outFields: "DESCRIP,LOCATION,YEARBUILT,LOCAL_REGISTER,LOCAL_REG_DATE,NATIONAL_REGISTER,NATIONAL_REG_DATE" }),
        ]);
      } catch (err) {
        console.warn("Building names / historic landmarks not loaded", err);
        return;
      }

      const boxes = features.map(f => {
        const polys = polygonsOf(f.geometry), xs = [], ys = [];
        for (const rings of polys) for (const [x, y] of rings[0]) { xs.push(x); ys.push(y); }
        return { f, polys, minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
      });
      const footprintAt = (x, y) => boxes.find(b =>
        x >= b.minX && x <= b.maxX && y >= b.minY && y <= b.maxY && b.polys.some(r => inRings(x, y, r)));

      const byAddress = new Map();   // ADDRESS -> footprints containing a point with that address
      const otherAddresses = new Map();
      for (const pt of points) {
        if (!pt.geometry) continue;
        const b = footprintAt(...pt.geometry.coordinates);
        if (!b) continue;
        const p = b.f.properties;
        const { ADDRESS, ALIAS, POINTTYPE } = pt.properties;
        const isBuilding = POINTTYPE === "Building";
        if (ADDRESS) {
          if (!byAddress.has(ADDRESS)) byAddress.set(ADDRESS, new Set());
          byAddress.get(ADDRESS).add(b.f);
          const list = isBuilding ? p.addresses : (otherAddresses.get(p) || otherAddresses.set(p, []).get(p));
          if (!list.includes(ADDRESS)) list.push(ADDRESS);
        }
        const name = (ALIAS || "").trim();
        if (!name) continue;
        const list = isBuilding ? p.names : p.tenants;
        if (!list.includes(name)) list.push(name);
      }
      for (const { f: { properties: p } } of boxes) {
        p.tenants = p.tenants.filter(n => !p.names.includes(n)).sort();
        if (!p.addresses.length) p.addresses = otherAddresses.get(p) || [];   // no building-level point
      }

      for (const h of historic) {
        const hp = h.properties;
        let matched = [...(byAddress.get((hp.LOCATION || "").toUpperCase().trim()) || [])];
        if (!matched.length) {
          const hPolys = polygonsOf(h.geometry);
          let best = null, bestKey = null;
          for (const b of boxes) {
            const corners = b.polys.flatMap(rings => rings[0].slice(0, -1));
            const share = corners.filter(([x, y]) => hPolys.some(r => inRings(x, y, r))).length / corners.length;
            if (!share) continue;
            // prefer: not a detached structure, at least half inside the parcel, then the largest
            const key = [b.f.properties.is_accessory ? 0 : 1, share >= 0.5 ? 1 : 0, b.f.properties.area_sqft || 0];
            const better = !bestKey || key[0] !== bestKey[0] ? !bestKey || key[0] > bestKey[0]
                         : key[1] !== bestKey[1] ? key[1] > bestKey[1]
                         : key[2] > bestKey[2];
            if (better) { best = b.f; bestKey = key; }
          }
          if (best) matched = [best];
        }
        for (const f of matched) f.properties.historic.push(hp);
      }
      const named = features.filter(f => f.properties.names.length).length;
      const hist = features.filter(f => f.properties.historic.length).length;
      console.log(`${named} buildings named, ${hist} historic landmarks matched`);
    }

    // QA notes from the deep dive, keyed by OBJECTID
    const QA_NOTES = {
      185320: "1 story but 0.1 ft tall: green-space accessory (790), possibly a bad elevation value",
      205530: "Small shed/accessory, 4-5.5 ft (plausible)",
      229319: "Small shed/accessory, 4-5.5 ft (plausible)",
      230736: "Small shed/accessory, 4-5.5 ft (plausible)",
      233281: "Height corrected to 42 ft (City value 4.1 ft; 3-story townhomes)",
      250262: "2 stories but 56.8 ft (28 ft per story): check on aerial imagery",
      207414: "4 Multi-Family addresses but UNITS = 0, likely missing",
      260635: "Falls Park Visitor Center & Observation Tower. City gives one height (67.3 ft, 7 stories) for the whole footprint; " +
              "drawn as the tower at 67.3 ft plus the 1-story visitor center estimated at 9.6 ft (67.3 ft ÷ 7 stories)",
    };

    // City footprints drawn as two parts (a tall part + a low part). Coordinates are the
    // City's own footprint vertices, split along the wall between the parts. The split is
    // skipped if the City changes the footprint (area no longer matches).
    const SPLIT_FOOTPRINTS = {
      260635: {  // Falls Park Visitor Center: observation tower + 1-story curved building (City photo 2025)
        expectAreaSqft: 2932.27,
        tall: { ring: [  // observation tower, City height 67.3 ft
          [-96.72233122810884, 43.55829958552212], [-96.72235635068282, 43.55820712610365],
          [-96.72247520447362, 43.55822420639327], [-96.72245008207226, 43.55831666584148],
          [-96.72233122810884, 43.55829958552212]] },
        low: [{ heightFt: 67.28 / 7, ring: [  // curved visitor center, 1 story = average story height
          [-96.72247087614706, 43.55824013976089], [-96.72248913472222, 43.55824219548996],
          [-96.72252501362118, 43.55824343279795], [-96.72256084492952, 43.5582419247753],
          [-96.72259628867835, 43.558237690757686], [-96.72263088992787, 43.558230778402965],
          [-96.7226643066417, 43.55822126192997], [-96.72269619439426, 43.558209246123354],
          [-96.72271327980246, 43.558201463349015], [-96.72276276054302, 43.55825434576779],
          [-96.72273147128364, 43.55826950235493], [-96.72269827184078, 43.558282287970336],
          [-96.7226634669827, 43.55829259883931], [-96.72262740103358, 43.55830033287612],
          [-96.72259045546703, 43.55830538783539], [-96.72255300724869, 43.55830771540543],
          [-96.72251355291746, 43.558308542557356], [-96.72247626173716, 43.55830607868651],
          [-96.72245372172246, 43.5583032704375], [-96.72247087614706, 43.55824013976089]] }],
      },
    };

    // STRUCTURE code hundreds digit -> use group
    const USE_GROUP = { 1: "res", 2: "res", 3: "office", 4: "inst", 5: "comm", 6: "ind", 7: "green", 9: "other" };

    // Each mode: legend classes (in display order) and how to pick a class for a building
    const MODES = {
      stories: {
        classes: [
          { key: "1-2",   label: "1–2 stories",  color: "#c6dbef" },
          { key: "3-5",   label: "3–5 stories",  color: "#6baed6" },
          { key: "6-8",   label: "6–8 stories",  color: "#2171b5" },
          { key: "9-11",  label: "9–11 stories", color: "#08306b" },
          { key: "other", label: "Unknown",      color: "#000000" },
        ],
        classify: p => {
          const s = p.NUMBERSTORIES;
          if (s >= 1 && s <= 2) return "1-2";
          if (s >= 3 && s <= 5) return "3-5";
          if (s >= 6 && s <= 8) return "6-8";
          if (s >= 9 && s <= 11) return "9-11";
          return "other";
        },
      },
      use: {
        classes: [
          { key: "res",    label: "Residential",           color: "#f1c40f" },
          { key: "office", label: "Office & government",   color: "#3498db" },
          { key: "inst",   label: "Institutional & public", color: "#9b59b6" },
          { key: "comm",   label: "Commercial & mixed use", color: "#e74c3c" },
          { key: "ind",    label: "Industrial",            color: "#7f8c8d" },
          { key: "green",  label: "Green space",           color: "#27ae60" },
          { key: "other",  label: "Other / unknown",       color: "#000000" },
        ],
        classify: p => p.use_group,
      },
      owner: {
        classes: [
          { key: "-1",    label: "Private",       color: "#95a5a6" },
          { key: "1",     label: "City",          color: "#2980b9" },
          { key: "2",     label: "City facility", color: "#1abc9c" },
          { key: "-2",    label: "Other",         color: "#e67e22" },
          { key: "-3",    label: "Renner Sanitary District", color: "#8e44ad" },
          { key: "other", label: "Unknown",       color: "#000000" },
        ],
        classify: p => (OWNER[String(p.OWNEDBY)] ? String(p.OWNEDBY) : "other"),
      },
      qa: {
        classes: [
          { key: "measured",           label: "Measured height",      color: "#2ecc71" },
          { key: "note",               label: "QA note (click building)", color: "#e74c3c" },
          { key: "proposed_no_height", label: "Proposed, no height",  color: "#f39c12" },
          { key: "missing",            label: "Missing height",       color: "#8e44ad" },
        ],
        classify: p => (QA_NOTES[p.OBJECTID] ? "note" : p.height_flag),
      },
    };
    for (const mode of Object.values(MODES)) {
      for (const c of mode.classes) c.cesiumColor = Cesium.Color.fromCssColorString(c.color);
    }

    const buildings = [];  // { entity, props } for every footprint
    const hidden = {};     // per mode: Set of legend keys the user switched off
    for (const name in MODES) hidden[name] = new Set();

    const el = id => document.getElementById(id);

    // "Show" filters: building groups that can be clicked off, like the legend classes
    const SHOW_FILTERS = [
      { key: "accessory", label: "Detached structures: garages, storage, park shelters…", match: p => p.is_accessory },
      { key: "proposed",  label: "Proposed: not constructed yet", match: p => p.height_flag === "proposed_no_height" },
      { key: "small",     label: "Footprints under 150 sq ft", match: p => p.area_sqft != null && p.area_sqft < 150 },
      { key: "historic",  label: "🏛 Historic landmarks", match: p => p.historic && p.historic.length > 0 },
    ];
    const filtersOn = new Set();  // keys of SHOW_FILTERS picked; when any are picked, only those buildings show

    // Recolor, filter and redraw the legend from the current panel settings
    function applyStyle() {
      const modeName = el("colorBy").value;
      const mode = MODES[modeName];
      const off = hidden[modeName];
      const minHeight = Number(el("minHeight").value);
      el("minHeightLabel").textContent = minHeight;

      const counts = {};
      const filterCounts = {};
      let shown = 0;
      for (const { entity, props: p, parts, icons } of buildings) {
        let key = mode.classify(p);
        if (!mode.classes.some(c => c.key === key)) key = "other";
        const cls = mode.classes.find(c => c.key === key);
        entity.polygon.material = cls.cesiumColor;

        const groups = SHOW_FILTERS.filter(f => f.match(p));
        for (const f of groups) filterCounts[f.key] = (filterCounts[f.key] || 0) + 1;

        const passesFilters =
          (filtersOn.size === 0 || groups.some(f => filtersOn.has(f.key))) &&
          (minHeight === 0 || (p.bldg_height != null && p.bldg_height >= minHeight));

        if (passesFilters) counts[key] = (counts[key] || 0) + 1;  // legend counts ignore legend toggles
        entity.show = passesFilters && !off.has(key);
        for (const part of parts) { part.polygon.material = cls.cesiumColor; part.show = entity.show; }
        for (const icon of icons) icon.show = entity.show;
        if (entity.show) shown++;
      }

      renderShowFilters(filterCounts);
      renderLegend(mode, off, counts);
      el("count").textContent = `${shown} of ${buildings.length} buildings shown`;
    }

    // Same look and behavior as the legend: click a row to hide/show that group
    function renderShowFilters(filterCounts) {
      const box = el("showFilters");
      box.innerHTML = '<div class="hint">Click a group to show only those buildings</div>';
      for (const f of SHOW_FILTERS) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "legend-row" + (filtersOn.has(f.key) ? " selected" : filtersOn.size ? " dim" : "");
        row.innerHTML = `${f.label} <em>(${filterCounts[f.key] || 0})</em>`;
        row.addEventListener("click", () => {
          filtersOn.has(f.key) ? filtersOn.delete(f.key) : filtersOn.add(f.key);
          applyStyle();
        });
        box.appendChild(row);
      }
      if (filtersOn.size) {
        const reset = document.createElement("button");
        reset.type = "button";
        reset.className = "legend-reset";
        reset.textContent = "Show all";
        reset.addEventListener("click", () => { filtersOn.clear(); applyStyle(); });
        box.appendChild(reset);
      }
    }

    function renderLegend(mode, off, counts) {
      const legend = el("legend");
      legend.innerHTML = '<div class="hint">Click a class to show/hide it</div>';
      for (const c of mode.classes) {
        if (!counts[c.key] && !off.has(c.key)) continue;  // skip empty classes
        const row = document.createElement("button");
        row.type = "button";
        row.className = "legend-row" + (off.has(c.key) ? " off" : "");
        row.innerHTML = `<span style="background:${c.color}"></span>${c.label} <em>(${counts[c.key] || 0})</em>`;
        row.addEventListener("click", () => {
          off.has(c.key) ? off.delete(c.key) : off.add(c.key);
          applyStyle();
        });
        legend.appendChild(row);
      }
      if (off.size) {
        const reset = document.createElement("button");
        reset.type = "button";
        reset.className = "legend-reset";
        reset.textContent = "Show all";
        reset.addEventListener("click", () => { off.clear(); applyStyle(); });
        legend.appendChild(reset);
      }
    }

    // Wire up the panel controls
    el("colorBy").addEventListener("change", applyStyle);
    // Moving the height slider brings back any legend classes that were clicked off,
    // so the slider alone decides which buildings show (the Show checkboxes still apply).
    el("minHeight").addEventListener("input", () => {
      for (const name in hidden) hidden[name].clear();
      applyStyle();
    });
    el("shadows").addEventListener("change", e => {
      viewer.shadows = e.target.checked;
      viewer.terrainShadows = e.target.checked ? Cesium.ShadowMode.RECEIVE_ONLY : Cesium.ShadowMode.DISABLED;
    });

    el("count").textContent = "Loading buildings…";
    loadBuildings().catch(err => {
      console.error(err);
      el("count").textContent = "Could not load buildings: " + err.message;
    });
    // Trees stream live from the City's Trees layer, clipped to the downtown boundary
    // (same as the buildings). Set SHOW_TREES to false to take them off the map.
    const SHOW_TREES = true;
    if (SHOW_TREES) {
      loadTrees().catch(err => console.error("Could not load trees:", err));
    }
  </script>
</body>
